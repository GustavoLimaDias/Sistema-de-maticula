<svg viewBox="0 0 1400 920" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="920" fill="#ffffff"/>

  <text x="700" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">
    Diagrama de Casos de Uso — Sistema de Matrículas (Sprint 1)
  </text>

  <!-- System boundary -->
  <rect x="230" y="40" width="710" height="850" fill="none" stroke="#333" stroke-width="2"/>
  <text x="585" y="62" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">Sistema de Matrículas</text>

  <!-- ===================== Associations (solid) ===================== -->
  <g stroke="#333" stroke-width="1.3" fill="none">
    <line x1="120" y1="155" x2="305" y2="105"/>
    <line x1="120" y1="155" x2="305" y2="220"/>
    <line x1="120" y1="155" x2="305" y2="340"/>
    <line x1="120" y1="155" x2="305" y2="460"/>
    <line x1="120" y1="425" x2="305" y2="95"/>
    <line x1="120" y1="425" x2="305" y2="580"/>
    <line x1="120" y1="655" x2="305" y2="100"/>
    <line x1="120" y1="655" x2="305" y2="700"/>
    <line x1="120" y1="655" x2="305" y2="820"/>
    <line x1="1210" y1="165" x2="925" y2="220"/>
  </g>

  <!-- ===================== Dependencies (dashed, with arrow) ===================== -->
  <g stroke="#333" stroke-width="1.3" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow)">
    <line x1="430" y1="186" x2="430" y2="136"/>
    <path d="M305,340 L262,340 L262,100 L305,105"/>
    <path d="M305,580 L240,580 L240,98 L305,98"/>
    <line x1="555" y1="220" x2="655" y2="220"/>
    <path d="M655,108 L555,195"/>
  </g>

  <g font-size="11" font-style="italic" fill="#555">
    <text x="437" y="164" text-anchor="start">«include»</text>
    <text x="202" y="215" text-anchor="middle">«include»</text>
    <text x="180" y="335" text-anchor="middle">«include»</text>
    <text x="600" y="212" text-anchor="middle">«include»</text>
    <text x="628" y="145" text-anchor="middle">«extend»</text>
  </g>

  <!-- ===================== Use case ovals (Column A) ===================== -->
  <g>
    <ellipse cx="430" cy="100" rx="125" ry="34" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="430" y="105" text-anchor="middle" font-size="13" fill="#1a365d">Efetuar Login</text>

    <ellipse cx="430" cy="220" rx="125" ry="34" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="430" y="215" text-anchor="middle" font-size="13" fill="#1a365d">Matricular-se em</text>
    <text x="430" y="230" text-anchor="middle" font-size="13" fill="#1a365d">Disciplina</text>

    <ellipse cx="430" cy="340" rx="125" ry="34" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="430" y="345" text-anchor="middle" font-size="13" fill="#1a365d">Cancelar Matrícula</text>

    <ellipse cx="430" cy="460" rx="125" ry="34" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="430" y="455" text-anchor="middle" font-size="13" fill="#1a365d">Consultar Disciplinas</text>
    <text x="430" y="470" text-anchor="middle" font-size="13" fill="#1a365d">Ofertadas</text>

    <ellipse cx="430" cy="580" rx="125" ry="34" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="430" y="575" text-anchor="middle" font-size="13" fill="#1a365d">Consultar Alunos</text>
    <text x="430" y="590" text-anchor="middle" font-size="13" fill="#1a365d">Matriculados</text>

    <ellipse cx="430" cy="700" rx="125" ry="34" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="430" y="695" text-anchor="middle" font-size="13" fill="#1a365d">Gerenciar Currículo</text>
    <text x="430" y="710" text-anchor="middle" font-size="13" fill="#1a365d">do Semestre</text>

    <ellipse cx="430" cy="820" rx="125" ry="40" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="430" y="808" text-anchor="middle" font-size="12" fill="#1a365d">Processar Encerramento</text>
    <text x="430" y="822" text-anchor="middle" font-size="12" fill="#1a365d">do Período de</text>
    <text x="430" y="836" text-anchor="middle" font-size="12" fill="#1a365d">Matrículas</text>
  </g>

  <!-- ===================== Use case ovals (Column B) ===================== -->
  <g>
    <ellipse cx="790" cy="220" rx="135" ry="34" fill="#fdf3e7" stroke="#c05621" stroke-width="1.5"/>
    <text x="790" y="215" text-anchor="middle" font-size="13" fill="#7b341e">Notificar Sistema</text>
    <text x="790" y="230" text-anchor="middle" font-size="13" fill="#7b341e">de Cobrança</text>

    <ellipse cx="790" cy="100" rx="135" ry="40" fill="#fdf3e7" stroke="#c05621" stroke-width="1.5"/>
    <text x="790" y="88" text-anchor="middle" font-size="12" fill="#7b341e">Encerramento Automático</text>
    <text x="790" y="102" text-anchor="middle" font-size="12" fill="#7b341e">por Lotação</text>
    <text x="790" y="116" text-anchor="middle" font-size="12" fill="#7b341e">(60 vagas)</text>
  </g>

  <!-- ===================== Actors ===================== -->
  <g stroke="#222" stroke-width="1.8" fill="none">
    <!-- Aluno -->
    <circle cx="100" cy="130" r="11" fill="#fff"/>
    <line x1="100" y1="141" x2="100" y2="175"/>
    <line x1="82" y1="155" x2="118" y2="155"/>
    <line x1="100" y1="175" x2="85" y2="205"/>
    <line x1="100" y1="175" x2="115" y2="205"/>
  </g>
  <text x="100" y="222" text-anchor="middle" font-size="13" fill="#111">Aluno</text>

  <g stroke="#222" stroke-width="1.8" fill="none">
    <!-- Professor -->
    <circle cx="100" cy="400" r="11" fill="#fff"/>
    <line x1="100" y1="411" x2="100" y2="445"/>
    <line x1="82" y1="425" x2="118" y2="425"/>
    <line x1="100" y1="445" x2="85" y2="475"/>
    <line x1="100" y1="445" x2="115" y2="475"/>
  </g>
  <text x="100" y="492" text-anchor="middle" font-size="13" fill="#111">Professor</text>

  <g stroke="#222" stroke-width="1.8" fill="none">
    <!-- Secretaria -->
    <circle cx="100" cy="630" r="11" fill="#fff"/>
    <line x1="100" y1="641" x2="100" y2="675"/>
    <line x1="82" y1="655" x2="118" y2="655"/>
    <line x1="100" y1="675" x2="85" y2="705"/>
    <line x1="100" y1="675" x2="115" y2="705"/>
  </g>
  <text x="100" y="722" text-anchor="middle" font-size="13" fill="#111">Secretaria</text>
  <text x="100" y="738" text-anchor="middle" font-size="13" fill="#111">Acadêmica</text>

  <g stroke="#222" stroke-width="1.8" fill="none">
    <!-- Sistema de Cobrança (ator secundário/externo) -->
    <circle cx="1230" cy="140" r="11" fill="#fff"/>
    <line x1="1230" y1="151" x2="1230" y2="185"/>
    <line x1="1212" y1="165" x2="1248" y2="165"/>
    <line x1="1230" y1="185" x2="1215" y2="215"/>
    <line x1="1230" y1="185" x2="1245" y2="215"/>
  </g>
  <text x="1230" y="232" text-anchor="middle" font-size="13" fill="#111">Sistema de</text>
  <text x="1230" y="248" text-anchor="middle" font-size="13" fill="#111">Cobrança</text>
  <text x="1230" y="264" text-anchor="middle" font-size="11" font-style="italic" fill="#555">(externo)</text>

  <!-- ===================== Legend ===================== -->
  <g font-size="12" fill="#333">
    <line x1="250" y1="880" x2="290" y2="880" stroke="#333" stroke-width="1.3"/>
    <text x="298" y="884">associação (ator ↔ caso de uso)</text>

    <line x1="250" y1="900" x2="290" y2="900" stroke="#333" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
    <text x="298" y="904">dependência «include» / «extend»</text>
  </g>
</svg>
